<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carrure</title>
<meta name="description" content="Programme muscu, trail et posture d'Iwan">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carrure">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: une colonne de cartes sobres, barre d'onglets en bas comme une app native */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#17201B; --muted:#5D6B63; --line:#DCE1DB;
  --accent:#1F55C9; --accent-ink:#FFFFFF; --soft:#E7EDFA;
  --good:#1D7F47; --good-soft:#E2F2E8; --warn:#9A5B00; --warn-soft:#FBF0DD;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1412; --surface:#18201C; --ink:#E7EDE9; --muted:#93A39A; --line:#29342F;
    --accent:#7199FF; --accent-ink:#0A1124; --soft:#1B2640;
    --good:#4DC17F; --good-soft:#15291E; --warn:#E5A640; --warn-soft:#2D2412;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding-block:12px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
h1{font:700 28px/1.15 var(--display);letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h2{font:650 17px/1.25 var(--display);margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--font);margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.good{background:var(--good);color:var(--surface)}
.btn:focus-visible,.tap:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tap{all:unset;display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.tap:first-of-type{border-top:0}
.tap .grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:20px;line-height:1}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-size:14px;font-weight:800}
.check.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.tap-card{width:100%;font:inherit;text-align:left}
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .muted,.hero .eyebrow{color:inherit;opacity:.8}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;font-size:11px;color:var(--muted);border:1px solid transparent}
.day b{font-size:13px;color:var(--ink)}
.day.today{border-color:var(--accent);background:var(--soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.ex{gap:8px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.presc{font:600 14px/1.2 var(--mono);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.set .n{font:600 12px var(--mono);color:var(--muted)}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.set .lbl{font-size:11px;color:var(--muted);text-align:center}
.setbtn{height:42px;border-radius:10px;border:2px solid var(--line);background:transparent;font-weight:800;color:var(--muted)}
.setbtn.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.last{font-size:13px;color:var(--muted)}
.hint{font-size:13px;font-weight:600;color:var(--good)}
.note{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:8px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary .num{font:600 12px var(--mono);color:var(--muted);width:18px;flex:none}
summary .dur{margin-left:auto;font:600 12px var(--mono);color:var(--accent);white-space:nowrap}
.how{margin:8px 0 4px 28px;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.how li{margin-left:16px}
.back{all:unset;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.timer{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .t{font:700 22px var(--mono);font-variant-numeric:tabular-nums}
.timer button{all:unset;cursor:pointer;font-weight:650;padding:6px 10px;border-radius:8px;background:rgba(127,127,127,.25)}
.timer.done{background:var(--good);color:var(--surface)}
.field{display:flex;gap:8px}
.field input{flex:1 1 90px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font-size:16px;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font:12px var(--mono)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.del{all:unset;cursor:pointer;color:var(--muted);padding:0 6px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;z-index:9}
@media (prefers-reduced-motion:no-preference){.setbtn,.check{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main id="app"></main>
<div id="timer" class="timer" hidden></div>
<nav class="tabs" id="tabs">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Aujourd'hui</button>
  <button data-tab="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 9.5v5M21 9.5v5M6 12h12"/></svg>Séances</button>
  <button data-tab="weight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Poids</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Plus</button>
</nav>
<script src="app.js"></script>
</body>
</html>
